name: CI/CD Pipeline - SmartDairy Production

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  # JOB 1: Continuous Integration (Verify code compiles & tests pass)
  build-and-test:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Operational Date Validator Tests
        run: ./mvnw test -Dtest=OperationalRecordDateValidatorTest

  # JOB 2: Continuous Deployment (Deploy via Systemd on AWS EC2)
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 240s
          script: |
            echo "🚀 Starting Automated CI/CD Deployment..."
            cd ~/SmartDairy-Multi-tenant-System-

            echo "📥 Pulling latest code from Git..."
            git fetch origin
            git reset --hard origin/master || git pull origin master

            echo "🔨 Building Spring Boot Production JAR..."
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests

            echo "⚙️ Ensuring Systemd Service exists..."
            sudo tee /etc/systemd/system/smartdairy.service > /dev/null << 'EOF'
            [Unit]
            Description=Smart Dairy Spring Boot Service
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu/SmartDairy-Multi-tenant-System-
            ExecStart=/usr/bin/java -Xms128m -Xmx256m -jar /home/ubuntu/SmartDairy-Multi-tenant-System-/target/smart-dairy-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
            SuccessExitStatus=143
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF

            echo "🔄 Reloading Systemd and Restarting Application..."
            sudo systemctl daemon-reload
            sudo systemctl enable smartdairy
            sudo systemctl restart smartdairy

            echo "🔍 Waiting 15s for Spring Boot startup..."
            sleep 15
            sudo systemctl status smartdairy --no-pager

            echo "✅ Deployment to AWS EC2 complete!"
