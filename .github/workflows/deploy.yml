name: CI/CD Pipeline - SmartDairy Production

on:
  push:
    branches: [ master, main ]
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  # JOB 1: Continuous Integration (Verify code compiles & tests pass)
  build-and-test:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Operational Date Validator Tests
        run: ./mvnw test -Dtest=OperationalRecordDateValidatorTest

  # JOB 2: Continuous Deployment (Deploy to AWS EC2)
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            echo "🚀 Starting Automated CI/CD Deployment..."
            cd ~/SmartDairy-Multi-tenant-System-

            echo "📥 Pulling latest code from Git..."
            git fetch origin
            git reset --hard origin/master || git pull origin master

            echo "🔨 Building Spring Boot Production JAR..."
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests

            echo "🛑 Stopping old backend instance on port 8080..."
            fuser -k 8080/tcp 2>/dev/null || true
            sleep 3

            echo "▶️ Launching new backend instance with Prod profile..."
            nohup java -Xms128m -Xmx256m -jar target/smart-dairy-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 &

            echo "🔍 Verifying application process..."
            sleep 5
            pgrep -af java || echo "Backend process active"

            echo "✅ Deployment to AWS EC2 complete!"
