name: CI/CD Pipeline - SmartDairy Production

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  # JOB 1: Continuous Integration (Verify code compiles & tests pass)
  build-and-test:
    name: Run Unit Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Full Unit & Security Test Suite (85 Tests)
        run: ./mvnw test

  # JOB 2: Continuous Deployment (Deploy via Sourced Environment)
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only run deployment if AWS EC2 secrets are configured in GitHub repo
    if: "${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}"
    steps:
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 240s
          script: |
            echo "🚀 Starting Automated CI/CD Deployment..."
            cd ~/SmartDairy-Multi-tenant-System-

            echo "📥 Pulling latest code from Git..."
            git fetch origin
            git reset --hard origin/master || git pull origin master

            echo "💾 Backing up previous working JAR before rebuild..."
            mkdir -p ~/backups
            if [ -f target/smart-dairy-backend-0.0.1-SNAPSHOT.jar ]; then
              cp target/smart-dairy-backend-0.0.1-SNAPSHOT.jar ~/backups/app-old.jar
            fi

            echo "🔨 Building Spring Boot Production JAR..."
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests

            echo "🛑 Stopping previous backend on port 8080..."
            fuser -k 8080/tcp 2>/dev/null || true
            sleep 2

            echo "🔑 Sourcing environment variables from all standard files..."
            [ -f /etc/environment ] && export $(grep -v '^#' /etc/environment | xargs -d '\n' 2>/dev/null) || true
            [ -f ~/.profile ] && source ~/.profile 2>/dev/null || true
            [ -f ~/.bashrc ] && eval "$(grep -E '^(export )?[A-Za-z0-9_]+=' ~/.bashrc | sed 's/^/export /')" || true
            [ -f .env ] && export $(grep -v '^#' .env | xargs -d '\n' 2>/dev/null) || true

            echo "▶️ Launching Spring Boot with verified environment..."
            nohup java -Xms256m -Xmx512m -jar target/smart-dairy-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 < /dev/null &

            echo "🔍 Waiting 18s for Spring Boot initialization..."
            sleep 18
            tail -n 25 app.log

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health || echo "000")
            echo "🩺 Post-deploy health check status: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "403" ]; then
              echo "❌ Health check failed ($HTTP_CODE)! Rolling back to ~/backups/app-old.jar..."
              fuser -k 8080/tcp 2>/dev/null || true
              sleep 2
              if [ -f ~/backups/app-old.jar ]; then
                cp ~/backups/app-old.jar target/smart-dairy-backend-0.0.1-SNAPSHOT.jar
                nohup java -Xms256m -Xmx512m -jar target/smart-dairy-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > app.log 2>&1 < /dev/null &
                sleep 15
                echo "🔄 Rolled back to previous working JAR!"
              fi
              exit 1
            fi

            echo "✅ Deployment verified and healthy!"
